<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#080908" />
  <title>PH Motions — Acesso Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css?v=20260916-5" />
</head>
<body class="login-page" data-page="login">
  <main class="shell login-shell">
    <section class="setup-state" data-setup hidden>
      <span class="brand-mark">PS</span>
      <p class="eyebrow">PH Motions · Analytics</p>
      <h1>Conexão<br><em>indisponível.</em></h1>
      <p>A página não conseguiu iniciar a conexão com o Analytics. Recarregue a página.</p>
    </section>

    <section class="auth-card" data-auth>
      <div class="auth-copy">
        <a class="brand login-brand" href="../" aria-label="Voltar ao portfólio">
          <span class="brand-mark">PS</span><span>PH Motions</span>
        </a>
        <p class="eyebrow">Acesso privado</p>
        <h1>PH Motions<br><em>Analytics.</em></h1>
        <p class="muted">Entre para visualizar tráfego, vídeos e conversões do seu portfólio.</p>
      </div>

      <form data-login-form>
        <label>Usuário<input name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required /></label>
        <label>Senha<input name="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">Entrar <span>↗</span></button>
        <p class="form-status" data-login-status aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="/analytics-config.js?v=20260916-5"></script>
  <script src="dashboard.js?v=20260916-5"></script>
</body>
</html>
